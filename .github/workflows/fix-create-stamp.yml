name: Apply Create Stamp fixes

on:
  push:
    paths:
      - '.github/workflows/fix-create-stamp.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Create Stamp
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()

          old = '''          <div\n            style={{\n              position: "absolute",\n              top: -10,\n              left: 10,\n              padding: "2px 7px",\n              borderRadius: 10,\n              background: STAMP_INK_BLUE,\n              color: C.white,\n              fontFamily: font.mono,\n              fontSize: 9.5,\n              fontWeight: 700,\n              letterSpacing: .2,\n              pointerEvents: "none",\n              whiteSpace: "nowrap",\n            }}\n          >\n            {selectedDimensions.widthMm} × {selectedDimensions.heightMm} mm}\n          </div>\n'''
          if old not in s:
              old = '''          <div\n            style={{\n              position: "absolute",\n              top: -10,\n              left: 10,\n              padding: "2px 7px",\n              borderRadius: 10,\n              background: STAMP_INK_BLUE,\n              color: C.white,\n              fontFamily: font.mono,\n              fontSize: 9.5,\n              fontWeight: 700,\n              letterSpacing: .2,\n              pointerEvents: "none",\n              whiteSpace: "nowrap",\n            }}\n          >\n            {selectedDimensions.widthMm} × {selectedDimensions.heightMm} mm\n          </div>\n'''
          if old not in s:
              raise SystemExit('Preview Size label block not found')
          s = s.replace(old, '', 1)

          old = '''            fontStyle: "normal", tall: false, invert: false,\n            layout: ["rightRotated", "bottom", "leftRotated"][side], triangleFrameId: id, triangleSide: side\n'''
          new = '''            fontStyle: "normal", tall: false, invert: false,\n            layout: ["rightRotated", "bottom", "leftRotated"][side], triangleFrameId: id, triangleSide: side,\n            // Triangle side text keeps its own fixed geometry. Resizing the\n            // triangle frame must resize only the triangle, never the text.\n            triangleTextRadius: radius\n'''
          if old not in s:
              raise SystemExit('Triangle layer creation block not found')
          s = s.replace(old, new, 1)

          old = '''          const r = Math.max(4, Math.min(size * 0.48, canvasHeight * 0.48, Number(frame.radius ?? 100)));\n          const points = [-90, 30, 150].map((deg) => {\n'''
          new = '''          // Use the side text's original triangle radius, not the current\n          // frame radius. This keeps all three texts the same size and place\n          // while the triangle itself is resized independently.\n          const textRadius = Number(layer.triangleTextRadius ?? frame.radius ?? 100);\n          const r = Math.max(4, Math.min(size * 0.48, canvasHeight * 0.48, textRadius));\n          const points = [-90, 30, 150].map((deg) => {\n'''
          if old not in s:
              raise SystemExit('Triangle renderer radius block not found')
          s = s.replace(old, new, 1)

          old = '''  const addPreloadedSymbol = (src, { forceNew = false } = {}) => {\n    const img = new Image();\n    img.onload = () => {\n      if (!forceNew && activeLayer && activeLayer.type === "image") {\n        updateLayer(activeLayer.id, { imageObj: img, imageDataUrl: src });\n      } else {\n'''
          new = '''  const addPreloadedSymbol = (src, { forceNew = false } = {}) => {\n    const img = new Image();\n    img.onload = () => {\n      // Toolbar Symbols always create a fresh image layer. They must not depend\n      // on an Image layer already being selected.\n      pushHistory();\n      {\n'''
          if old not in s:
              raise SystemExit('Symbol handler block not found')
          s = s.replace(old, new, 1)

          old = '''        setLayers((ls) => [...ls, layer]);\n        setActiveLayerId(id);\n      }\n    };\n    img.src = src;\n    setSymbolPickerOpen(false);\n  };\n'''
          new = '''        setLayers((ls) => [...ls, layer]);\n        setActiveLayerId(id);\n      }\n    };\n    img.src = src;\n    setSymbolPickerOpen(false);\n  };\n'''
          # Keep the closing structure unchanged; the replacement above only\n          # removes the old selected-image branch and makes every symbol new.\n
          old_picker = '''                position: "absolute", top: "calc(100% + 8px)", right: 0, zIndex: 80,\n                minWidth: 170, padding: 8, background: C.white,\n'''
          new_picker = '''                position: "fixed", top: isDesktop ? 64 : 58, right: isDesktop ? 18 : 8, zIndex: 180,\n                minWidth: 170, padding: 8, background: C.white,\n'''
          if old_picker not in s:
              raise SystemExit('Symbol picker positioning block not found')
          s = s.replace(old_picker, new_picker, 1)

          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No changes needed'
          else
            git add src/App.jsx
            git commit -m 'fix: Create Stamp triangle text and symbols'
            git push
          fi
